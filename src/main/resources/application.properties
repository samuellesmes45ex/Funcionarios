# Nombre de la aplicación
spring.application.name=funcionarios

# Puerto del servidor (8081 por defecto para evitar conflicto con el Tomcat preinstalado en 8080)
server.port=${SERVER_PORT:8081}

# Conexión a MySQL en Aiven
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql-26c808f5-samuellesmes45-1d36.b.aivencloud.com}:${DB_PORT:28057}/${DB_NAME:defaultdb}?sslMode=REQUIRED&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:avnadmin}
spring.datasource.password=${DB_PASSWORD:TU_CONTRASEÑA_AIVEN}

# JPA / Hibernate (update crea o actualiza las tablas sin borrar datos existentes)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
